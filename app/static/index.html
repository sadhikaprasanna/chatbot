<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Firefox &amp; Mozilla VPN Support</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; }
  #log { border: 1px solid #ccc; border-radius: 8px; height: 60vh; overflow-y: auto; padding: 12px; }
  .msg { margin: 10px 0; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }
  .user { background: #e8f0fe; margin-left: 20%; }
  .bot { background: #f4f4f4; margin-right: 10%; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; color: #fff; margin-right: 6px; }
  .answered { background: #2e7d32; } .clarify { background: #f9a825; }
  .out_of_scope { background: #757575; } .handoff { background: #c62828; }
  .cites { font-size: 13px; margin-top: 6px; } .cites a { display: block; }
  .handoffbox { border: 2px solid #c62828; border-radius: 6px; padding: 8px; margin-top: 8px; font-size: 13px; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; padding: 10px; font-size: 15px; }
  button { padding: 10px 16px; }
</style>
</head>
<body>
<h2>Firefox &amp; Mozilla VPN Support</h2>
<div id="log"></div>
<form id="f"><input id="m" placeholder="Ask a question..." autocomplete="off" maxlength="1000" required>
<button id="b">Send</button></form>
<script>
const sid = "web-" + Math.random().toString(36).slice(2, 10);
const log = document.getElementById("log");

function add(cls, node) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.appendChild(node);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
const text = (t) => document.createTextNode(t);

function render(r) {
  const wrap = document.createElement("div");
  const badge = document.createElement("span");
  badge.className = "badge " + r.status;
  badge.textContent = r.status;
  wrap.appendChild(badge);
  wrap.appendChild(text(r.answer));
  if (r.citations && r.citations.length) {
    const c = document.createElement("div");
    c.className = "cites";
    c.appendChild(text("Sources:"));
    r.citations.forEach(x => {
      const a = document.createElement("a");
      a.href = x.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = x.title + (x.section ? " > " + x.section : "");
      c.appendChild(a);
    });
    wrap.appendChild(c);
  }
  if (r.handoff) {
    const h = document.createElement("div");
    h.className = "handoffbox";
    h.textContent = "Handoff to a human agent. Summary: " + r.handoff.summary +
      " | Intent: " + r.handoff.intent +
      " | Articles tried: " + (r.handoff.articles_tried.join(", ") || "none");
    wrap.appendChild(h);
  }
  return wrap;
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("m"), btn = document.getElementById("b");
  const msg = input.value.trim();
  if (!msg) return;
  add("user", text(msg));
  input.value = ""; btn.disabled = true;
  const pending = add("bot", text("Thinking..."));
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ session_id: sid, message: msg }) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    pending.replaceChildren(render(await res.json()));
  } catch (err) {
    pending.replaceChildren(text("Sorry, the request failed. Please try again."));
  }
  btn.disabled = false; input.focus(); log.scrollTop = log.scrollHeight;
});
</script>
</body>
</html>
